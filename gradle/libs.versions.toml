# Versions checked against Maven Central on Nov 23, 2026.
# TODO: add the gRPC libraries, and WireMock for Build 2.0.

[versions]
jackson = "3.3.0"
junit = "6.1.3"
assertj = "3.27.7"

[libraries]
# Entries without a version get it from the BOM above them.
jackson-bom = { module = "tools.jackson:jackson-bom", version.ref = "jackson" }
jackson-databind = { module = "tools.jackson.core:jackson-databind" }
jackson-yaml = { module = "tools.jackson.dataformat:jackson-dataformat-yaml" }

junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-launcher = { module = "org.junit.platform:junit-platform-launcher" }

assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }
